<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Pong — Responsive + Two-player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Simple Pong</h1>

    <div class="controls-row">
      <div id="scoreboard">
        <span id="playerScore">0</span>
        <span class="dash"> - </span>
        <span id="computerScore">0</span>
      </div>

      <label class="toggle">
        <input type="checkbox" id="twoPlayerToggle" />
        Two-player (W / S for right paddle)
      </label>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" aria-label="Pong game"></canvas>
    </div>

    <div id="help">
      Move the left paddle with the mouse or ArrowUp / ArrowDown keys. Enable "Two-player" to control the right paddle with W / S. Click the canvas or press Space to serve/restart after a point.
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
